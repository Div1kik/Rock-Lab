<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <meta name="theme-color" content="#161412" />
  <title>Rock Lab — Easy Dopamine Games</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700&family=Rubik:wght@500;600;700&display=swap"
    rel="stylesheet"
  />

  <script src="https://cdn.jsdelivr.net/npm/@vkontakte/vk-bridge@2.15.4/dist/browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #161412;
      touch-action: none;
      -webkit-font-smoothing: antialiased;
    }

    #game-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    canvas {
      display: block;
      touch-action: none;
    }

    #debug-log {
      display: none;
      position: fixed;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 9999;
      background: rgba(127, 29, 29, 0.95);
      color: #fef2f2;
      font-family: monospace;
      font-size: 12px;
      padding: 10px;
      border-radius: 8px;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <div id="debug-log"></div>

  <script>
    const showErr = (msg) => {
      const box = document.getElementById('debug-log');
      if (box) {
        box.style.display = 'block';
        box.textContent += msg + '\n';
      }
    };
    window.addEventListener('error', (e) => showErr('ERR: ' + (e.message || e.filename)));
    window.addEventListener('unhandledrejection', (e) => showErr('PROMISE: ' + (e.reason?.message || e.reason)));
    window.addEventListener('contextmenu', (e) => e.preventDefault());
  </script>

  <script type="module">
    const startApp = async () => {
      try {
        if (document.fonts && document.fonts.ready) {
          await Promise.race([
            document.fonts.ready,
            new Promise((resolve) => setTimeout(resolve, 600))
          ]);
        }
      } catch {}
      try {
        if (typeof Phaser === 'undefined') {
          throw new Error('Phaser CDN не загрузился');
        }
        await import('./src/main.js?v=2');
      } catch (err) {
        const box = document.getElementById('debug-log');
        if (box) {
          box.style.display = 'block';
          box.textContent += 'BOOT FAIL: ' + (err?.message || err) + '\n';
        }
      }
    };
    startApp();
  </script>
</body>
</html>
